spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
app.database.initialize=${DB_INITIALIZE:false}

server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
server.url=${SERVER_URL}
app.base-url=${SERVER_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
upload.dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
jwt.secret=${JWT_SECRET}

groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.mail.provider=${MAIL_PROVIDER:brevo}
brevo.api.key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:Bookish}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:BookStore <noreply@example.com>}
app.verification.code-expiry-minutes=10
